name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: uv run --locked ruff format --check src scripts tests
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q
      - run: node --test tests/test_figures.mjs tests/test_report.mjs
      - run: node --check scripts/figures/export.mjs
      - name: Bounded source distributions
        run: |
          uv build
          uv run --locked python - <<'PY'
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath
          from tempfile import TemporaryDirectory

          original = next(Path("dist").glob("*.tar.gz")).resolve()
          with TemporaryDirectory() as temporary:
              root = Path(temporary)
              with tarfile.open(original) as archive:
                  archive.extractall(root, filter="data")
              source = next(path for path in root.iterdir() if path.is_dir())
              for name in ("runs/private.csv", "research/private.py", "docs/private.html"):
                  path = source / name
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("must not be distributed\n")
              output = root / "rebuilt"
              subprocess.run(["uv", "build", str(source), "--out-dir", str(output)], check=True)
              for path in (original, next(output.glob("*.tar.gz"))):
                  with tarfile.open(path) as archive:
                      files = {PurePosixPath(*PurePosixPath(name).parts[1:]) for name in archive.getnames()}
                  assert not any(path.parts[0] in {"runs", "research", ".venv", "dist"} for path in files)
                  assert not any(path.parts[0] == "docs" and path.suffix == ".html" for path in files)
                  required = {"src/greq/__init__.py", "scripts/run.py", "scripts/figures/assets/index.html", "tests/test_learning.py", "docs/example.svg", "README.md", "pyproject.toml", "uv.lock"}
                  assert required <= {str(path) for path in files}
                  print(f"Validated {len(files)} source files in {path.name}")
          PY
      - name: Single configuration
        run: >-
          uv run --locked python -m scripts.run
          --output runs/checks/ci-single --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
      - name: Per-transition NeSA
        run: >-
          uv run --locked python -m scripts.run --method nesa --zeta 0.5
          --output runs/checks/ci-nesa --n-steps 12 --eval-every 4
          --n-states 2 --n-actions 2 --branching 2
      - name: Flat tuning CSV
        run: >-
          uv run --locked python -m scripts.finetune
          --output runs/checks/ci-final --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
          --gammas 0.9 --etas 1 --rhos 0.7 --ql-etas 0.5 --ql-k0s 10
          --nesa-etas 1 --nesa-k0s 1 --nesa-zetas 0.5 1
          --selection-seeds 0 1 --methods greq ql nesa zap zap-batched
      - name: Eleven-seed evaluation and scalar runtime CSVs
        run: >-
          uv run --locked python -m scripts.report --runtime
          --output runs/checks/ci-final --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
          --gammas 0.9 --etas 1 --rhos 0.7 --ql-etas 0.5 --ql-k0s 10
          --nesa-etas 1 --nesa-k0s 1 --nesa-zetas 0.5 1
          --selection-seeds 0 1 --methods greq ql nesa zap zap-batched
      - name: Standalone HTML figures
        run: uv run --locked python -m scripts.figures --data runs/checks/ci-final
      - name: Validated CSV reuse
        run: >-
          uv run --locked python -m scripts.report --runtime
          --output runs/checks/ci-final --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
          --gammas 0.9 --etas 1 --rhos 0.7 --ql-etas 0.5 --ql-k0s 10
          --nesa-etas 1 --nesa-k0s 1 --nesa-zetas 0.5 1
          --selection-seeds 0 1 --methods greq ql nesa zap zap-batched
      - name: Shifted reciprocal NeSA
        run: >-
          uv run --locked python -m scripts.run --method nesa --t0 100 --zeta 0.1
          --output runs/checks/ci-shifted-single --n-steps 12 --eval-every 4
          --n-states 2 --n-actions 2 --branching 2
      - name: Two-parameter NeSA selection, evaluation and scalar runtime
        run: >-
          uv run --locked python -m scripts.report --methods nesa --runtime
          --output runs/checks/ci-shifted --n-steps 12 --eval-every 4
          --n-states 2 --n-actions 2 --branching 2 --gammas 0.9
          --selection-seeds 0 1 --nesa-t0s 1 100 --nesa-zetas 0.1 1
      - name: Shifted NeSA standalone figures
        run: uv run --locked python -m scripts.figures --data runs/checks/ci-shifted
      - name: Shifted NeSA validated reuse
        run: >-
          uv run --locked python -m scripts.report --methods nesa --runtime
          --output runs/checks/ci-shifted --n-steps 12 --eval-every 4
          --n-states 2 --n-actions 2 --branching 2 --gammas 0.9
          --selection-seeds 0 1 --nesa-t0s 1 100 --nesa-zetas 0.1 1
