name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff format --check src scripts tests
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q
      - run: uv build
      - name: CLI smoke test
        run: >-
          uv run --locked python -m scripts.run
          --output runs/ci-smoke --n-steps 20 --eval-every 10
          --n-states 2 --n-actions 2 --branching 2
