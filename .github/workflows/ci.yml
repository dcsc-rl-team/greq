name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked
      - run: uv run --locked ruff format --check src scripts tests
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest -q
      - run: node --test tests/test_figures.mjs tests/test_report.mjs
      - run: node --check scripts/figures/export.mjs
      - run: uv build
      - name: Single configuration
        run: >-
          uv run --locked python -m scripts.run
          --output runs/checks/ci-single --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
      - name: Flat tuning CSV
        run: >-
          uv run --locked python -m scripts.finetune
          --output runs/checks/ci-final --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
          --gammas 0.9 --etas 1 --rhos 0.7 --ql-etas 0.5 --ql-k0s 10
          --selection-seeds 0 1
      - name: Eleven-seed evaluation and scalar runtime CSVs
        run: >-
          uv run --locked python -m scripts.report --runtime
          --output runs/checks/ci-final --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
          --gammas 0.9 --etas 1 --rhos 0.7 --ql-etas 0.5 --ql-k0s 10
          --selection-seeds 0 1
      - name: Standalone HTML figures
        run: uv run --locked python -m scripts.figures --data runs/checks/ci-final
      - name: Validated CSV reuse
        run: >-
          uv run --locked python -m scripts.report --runtime
          --output runs/checks/ci-final --n-steps 4 --eval-every 2
          --n-states 2 --n-actions 2 --branching 2
          --gammas 0.9 --etas 1 --rhos 0.7 --ql-etas 0.5 --ql-k0s 10
          --selection-seeds 0 1
